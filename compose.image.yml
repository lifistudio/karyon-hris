# Image-only: used by install.sh and raw Compose (Dokploy) after an image is published.
# Values come from the .env next to this file (install.sh generates it) or the Dokploy environment.
# PostgreSQL 18 data lives in a new volume; a PostgreSQL 17 volume is never reused automatically.
name: ${COMPOSE_PROJECT_NAME:-hris}
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-trixie}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_DB_NAME: ${HRIS_DB_NAME:-hris}
      APP_DB_USER: ${HRIS_DB_USER:-hris}
      APP_DB_PASSWORD: ${HRIS_DB_PASSWORD:?Set HRIS_DB_PASSWORD}
    configs:
      - source: app_db_role
        target: /docker-entrypoint-initdb.d/10-app-role.sh
        mode: 0555
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d \"$$APP_DB_NAME\""]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    image: ${HRIS_IMAGE:?Set a published image tag or digest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Empty = the bundled postgres service below. Put an external PostgreSQL URL in .env any time after installing;
      # it takes precedence over HRIS_DB_HOST (run the installer again to also stop the bundled database).
      HRIS_DATABASE_URL: ${HRIS_DATABASE_URL:-}
      HRIS_DB_HOST: postgres
      HRIS_DB_PORT: "5432"
      HRIS_DB_NAME: ${HRIS_DB_NAME:-hris}
      HRIS_DB_USER: ${HRIS_DB_USER:-hris}
      HRIS_DB_PASSWORD: ${HRIS_DB_PASSWORD:?Set HRIS_DB_PASSWORD}
      HRIS_DB_SSL: ${HRIS_DB_SSL:-disable}
      AUTH_SECRET: ${AUTH_SECRET:?Set session secret}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Number of reverse proxies in front of the app (1 for Dokploy/Traefik or nginx). 0 = none.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set encryption key}
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:?Set signing secret}
      CRON_SECRET: ${CRON_SECRET:?Set cron secret}
      LOCAL_STORAGE_PATH: /app/storage
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      HRIS_DB_POOL_MAX: ${HRIS_DB_POOL_MAX:-10}
      # Optional integrations. Only variables listed here reach the container; empty = off.
      # Audit log: database (default), axiom, or http.
      AUDIT_LOG_PROVIDER: ${AUDIT_LOG_PROVIDER:-database}
      AXIOM_DATASET: ${AXIOM_DATASET:-}
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AUDIT_LOG_ENDPOINT: ${AUDIT_LOG_ENDPOINT:-}
      AUDIT_LOG_TOKEN: ${AUDIT_LOG_TOKEN:-}
      # WhatsApp: none, fonnte, twilio, qontak, or webhook.
      WA_PROVIDER: ${WA_PROVIDER:-none}
      FONNTE_TOKEN: ${FONNTE_TOKEN:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      QONTAK_API_TOKEN: ${QONTAK_API_TOKEN:-}
      QONTAK_CHANNEL_INTEGRATION_ID: ${QONTAK_CHANNEL_INTEGRATION_ID:-}
      QONTAK_TEMPLATE_ID: ${QONTAK_TEMPLATE_ID:-}
      QONTAK_BASE_URL: ${QONTAK_BASE_URL:-}
      QONTAK_DEFAULT_TO_NAME: ${QONTAK_DEFAULT_TO_NAME:-}
      QONTAK_LANGUAGE_CODE: ${QONTAK_LANGUAGE_CODE:-}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      # Public career API and anti-bot for the application form.
      PUBLIC_API_KEY: ${PUBLIC_API_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Address search for branch locations (HTTPS, Nominatim-compatible).
      GEOCODING_SEARCH_URL: ${GEOCODING_SEARCH_URL:-}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-}
      GEOCODING_PUBLIC_NOMINATIM_ACK: ${GEOCODING_PUBLIC_NOMINATIM_ACK:-}
      # Corporate SSO (OIDC, Pro).
      OIDC_NAME: ${OIDC_NAME:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # true only when an external scheduler calls /api/v1/cron/daily with CRON_SECRET.
      HRIS_DISABLE_SCHEDULER: ${HRIS_DISABLE_SCHEDULER:-}
      # License website (HTTPS) used by Lisensi & Paket for activation and lease renewal.
      HRIS_LICENSE_SERVER: ${HRIS_LICENSE_SERVER:-}
      # Only with compose.lifecycle.yml: lets the agent read the signed lease from this app.
      HRIS_AGENT_TOKEN: ${HRIS_AGENT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/storage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  postgres18_data:
  uploads:
configs:
  # Runs once on an empty data volume: the application connects as a
  # non-superuser that owns only its own database.
  app_db_role:
    content: |
      #!/bin/sh
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" \
        -v app_user="$$APP_DB_USER" -v app_password="$$APP_DB_PASSWORD" -v app_db="$$APP_DB_NAME" <<'SQL'
      CREATE ROLE :"app_user" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD :'app_password';
      CREATE DATABASE :"app_db" OWNER :"app_user";
      REVOKE ALL ON DATABASE :"app_db" FROM PUBLIC;
      SQL
